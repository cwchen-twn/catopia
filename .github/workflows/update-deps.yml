name: Weekly Dependency Updates

on:
  schedule:
    - cron: "0 9 * * 1" # Every Monday at 09:00 UTC
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Update minor dependencies
        run: bun run ncu-minor

      - name: Install updated dependencies
        run: bun install

      - name: Create pull request
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore: update minor dependencies"
          title: "chore: weekly minor dependency updates"
          body: |
            Automated weekly dependency update (minor versions only).

            Generated by the `ncu-minor` script via GitHub Actions.
          branch: deps/weekly-minor-updates
          delete-branch: true
          labels: dependencies
